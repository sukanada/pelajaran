<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan Soal Matematika SMP</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--ink:#1b2430;--muted:#5b6778;--line:#d9e0ea;--accent:#1f5fbf;--ok:#16794a;--okbg:#e4f4ec;--bad:#b3261e;--badbg:#fbe9e7}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--surface:#1b212a;--ink:#e8edf3;--muted:#9aa6b6;--line:#2c3542;--accent:#6ea2f0;--ok:#5fd19a;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#score{margin-left:auto;font-weight:600}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.q h2{font-size:1rem;margin:0 0 6px;color:var(--muted);font-weight:600}
.q p{margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input{font:inherit;width:11rem;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.fb{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.key{display:none;margin-top:10px;border-left:4px solid var(--accent);padding:6px 12px;font-size:.95rem}
.q.show .key{display:block}
.hint{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Latihan Soal Matematika SMP</h1>
<p class="sub">10 soal campuran: bilangan, aljabar, perbandingan, geometri, dan statistika. Tulis jawabanmu lalu tekan Periksa.</p>
<div class="bar">
<button class="primary" id="checkAll">Periksa semua</button>
<button id="toggleKey">Tampilkan kunci jawaban</button>
<button id="reset">Ulangi</button>
<span id="score" aria-live="polite"></span>
</div>
<p class="hint">Pecahan ditulis seperti 13/20. Untuk soal bersatuan, cukup tulis angkanya. Soal 7 diisi dua angka dipisah koma (keliling, luas).</p>
<div id="list"></div>
</main>
<script>
var Q=[
{t:"Hitunglah 3/4 + 2/5 − 1/2.",a:["13/20"],k:"Samakan penyebut: 15/20 + 8/20 − 10/20 = 13/20."},
{t:"Hitunglah (−12) : 3 + 5 × (−2).",a:["-14"],k:"(−12) : 3 = −4 dan 5 × (−2) = −10, jadi −4 + (−10) = −14."},
{t:"Tentukan nilai x dari 3x − 7 = 11.",a:["6"],k:"3x = 18, maka x = 6."},
{t:"Tentukan nilai x dari 2(x + 4) = 5x − 7.",a:["5"],k:"2x + 8 = 5x − 7, maka 15 = 3x, sehingga x = 5."},
{t:"Harga sebuah baju Rp150.000 dan mendapat diskon 20%. Berapa rupiah yang harus dibayar?",a:["120000"],k:"Diskon = 20% × 150.000 = 30.000, jadi bayar 120.000."},
{t:"Perbandingan umur Ayu dan Budi adalah 3 : 5. Jika jumlah umur mereka 48 tahun, berapa umur Budi?",a:["30"],k:"Total perbandingan 8, jadi 48 : 8 = 6. Umur Budi = 5 × 6 = 30 tahun."},
{t:"Sebuah persegi panjang berukuran 12 cm × 8 cm. Tulis keliling dan luasnya (cm dan cm²), dipisah koma.",a:["40,96"],k:"Keliling = 2 × (12 + 8) = 40 cm. Luas = 12 × 8 = 96 cm²."},
{t:"Sebuah segitiga siku-siku memiliki sisi tegak 6 cm dan 8 cm. Berapa panjang sisi miringnya (cm)?",a:["10"],k:"Pythagoras: √(6² + 8²) = √100 = 10 cm."},
{t:"Hitunglah luas lingkaran berjari-jari 14 cm (π = 22/7) dalam cm².",a:["616"],k:"L = π × r² = 22/7 × 14 × 14 = 616 cm²."},
{t:"Nilai ulangan lima siswa: 70, 80, 75, 90, 85. Tentukan rata-ratanya.",a:["80"],k:"Jumlah = 400, lalu 400 : 5 = 80."}
];
var list=document.getElementById("list");
function norm(s){return s.replace(/\s+/g,"").replace(/[−–]/g,"-").replace(/\./g,"").replace(/cm2?|cm²|rp/gi,"").toLowerCase()}
Q.forEach(function(q,i){
var d=document.createElement("section");d.className="q";d.id="q"+i;
d.innerHTML='<h2>Soal '+(i+1)+'</h2><p>'+q.t+'</p><div class="row"><input id="a'+i+'" type="text" autocomplete="off" aria-label="Jawaban soal '+(i+1)+'"><button data-i="'+i+'">Periksa</button></div><div id="f'+i+'"></div><div class="key"><strong>Kunci:</strong> '+q.a[0].replace(",",", ")+'. '+q.k+'</div>';
list.appendChild(d);
});
function check(i){
var v=norm(document.getElementById("a"+i).value),f=document.getElementById("f"+i);
if(!v){f.innerHTML="";return null}
var ok=Q[i].a.some(function(x){return norm(x)===v});
f.innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?"Benar.":"Belum tepat. Coba lagi atau lihat kunci jawaban.")+'</div>';
return ok;
}
function score(){
var n=0;
Q.forEach(function(q,i){var r=check(i);if(r)n++});
document.getElementById("score").textContent="Benar "+n+" dari "+Q.length;
}
list.addEventListener("click",function(e){var i=e.target.getAttribute("data-i");if(i!==null){check(+i)}});
document.getElementById("checkAll").onclick=score;
var shown=false;
document.getElementById("toggleKey").onclick=function(){
shown=!shown;
document.querySelectorAll(".q").forEach(function(el){el.classList.toggle("show",shown)});
this.textContent=shown?"Sembunyikan kunci jawaban":"Tampilkan kunci jawaban";
};
document.getElementById("reset").onclick=function(){
Q.forEach(function(q,i){document.getElementById("a"+i).value="";document.getElementById("f"+i).innerHTML=""});
document.getElementById("score").textContent="";
};
</script>
</body>
</html>
