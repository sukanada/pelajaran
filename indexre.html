<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Video: Perbandingan Berbalik Nilai</title>
<style>
:root{--gold:#e8c46a;--gold2:#b8862b;--ink:#f6f0ff;--mute:#c4b5e0;--line:rgba(232,196,106,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{height:100%}
body{height:100%;margin:0;color:var(--ink);font:17px/1.55 "Trebuchet MS","Segoe UI",Verdana,sans-serif;background:radial-gradient(ellipse at 15% 10%,#5b2a86 0,transparent 55%),radial-gradient(ellipse at 90% 95%,#7a1f4b 0,transparent 50%),linear-gradient(135deg,#0a0618,#1a0b3a 50%,#2a0f4d)}
#app{height:100%;max-width:960px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#pb{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}#pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .4s}
h2{font:700 clamp(1.5rem,5vw,2.4rem)/1.15 Georgia,serif;margin:0;color:var(--gold)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto}
canvas{width:100%;height:clamp(150px,34vh,320px);border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.28);flex:none}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{padding:10px 14px;border-left:5px solid var(--gold);background:rgba(0,0,0,.28);border-radius:8px;font-size:clamp(1rem,3.4vw,1.3rem);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
li.on{opacity:1;transform:none}li.big{font:700 clamp(1.2rem,4vw,1.8rem) Georgia,serif}
#sub{min-height:3.4em;text-align:center;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.4);color:#fff;font-size:1rem}
#ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding-bottom:6px}
button,select{font:inherit;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--gold);border-radius:10px;padding:8px 14px}
#pp{background:linear-gradient(135deg,#fff1c2,var(--gold),var(--gold2));color:#2a0f4d;font-weight:700;border:0;min-width:110px}
#dots{display:flex;gap:6px}#dots button{width:12px;height:12px;padding:0;border-radius:50%}#dots button[aria-current=true]{background:var(--gold);width:26px;border-radius:7px}
#start{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:rgba(10,6,24,.93)}
#start h1{font:700 clamp(2rem,7vw,3.6rem)/1.1 Georgia,serif;margin:0;color:var(--gold)}#start p{margin:0;color:var(--mute);max-width:34em}
#start button{font-size:1.2rem;padding:14px 30px;background:linear-gradient(135deg,#fff1c2,var(--gold),var(--gold2));color:#2a0f4d;font-weight:700;border:0}
button:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="start"><h1>Perbandingan Berbalik Nilai</h1><p>Video penjelasan dengan suara. Nyalakan volume perangkatmu, lalu tekan tombol di bawah.</p><button id="go">Putar video</button></div>
<div id="app">
<div id="pb"><i></i></div>
<h2 id="ttl"></h2>
<div id="main"><canvas id="cv"></canvas><ul id="ln"></ul></div>
<div id="sub" aria-live="polite"></div>
<div id="ctl">
<button id="pv" aria-label="Bagian sebelumnya">Sebelumnya</button>
<button id="pp">Jeda</button>
<button id="nx" aria-label="Bagian berikutnya">Berikutnya</button>
<div id="dots"></div>
<button id="mu">Suara: nyala</button>
<select id="rt" aria-label="Kecepatan suara"><option value="0.85">Lambat</option><option value="1" selected>Normal</option><option value="1.2">Cepat</option></select>
</div>
</div>
<script>
var $=function(s){return document.querySelector(s)};
/* b = beat: s=narasi, l=baris yang muncul, v=indeks nilai pada animasi, w=jeda (ms) bila tanpa suara */
var S=[
{t:"Perbandingan Berbalik Nilai",L:["Makin banyak pekerja, makin singkat waktunya"],b:[{s:"Halo! Di video ini kita belajar perbandingan berbalik nilai. Intinya, makin banyak pekerja, makin singkat waktu pengerjaannya.",l:0}]},
{t:"Pengertian",L:["Satu besaran naik, besaran lain turun","Hasil kali keduanya selalu tetap","x₁ × y₁ = x₂ × y₂ = k"],big:2,b:[
{s:"Dua besaran disebut berbanding terbalik, jika yang satu bertambah, maka yang lain berkurang.",l:0},
{s:"Ciri utamanya, hasil kali kedua besaran itu selalu tetap.",l:1},
{s:"Kita tulis: x satu dikali y satu, sama dengan x dua dikali y dua, sama dengan k. Huruf k adalah hasil kali yang tetap.",l:2}]},
{t:"Membangun Tembok",L:["1 kubus = 1 pekerja × 1 hari","Total pekerjaan = 24 kubus"],vis:{k:24,xl:"pekerja",yl:"hari",xs:[2,3,4,6,8,12]},b:[
{s:"Bayangkan satu tembok butuh 24 kubus pekerjaan. Satu kubus sama dengan satu pekerja bekerja selama satu hari.",l:1,v:2},
{s:"Dengan 4 pekerja, tembok selesai dalam 6 hari.",l:0,v:2},
{s:"Tambah menjadi 8 pekerja. Waktunya tinggal 3 hari.",v:4},
{s:"Dengan 12 pekerja, tembok selesai hanya dalam 2 hari.",v:5},
{s:"Sebaliknya, kalau hanya 2 pekerja, butuh 12 hari.",v:0},
{s:"Perhatikan, luas persegi panjang ini selalu 24. Itulah hasil kali yang tetap.",v:2}]},
{t:"Cara Menghitungnya",L:["1. Tulis x₁ dan y₁ dari soal","2. Hitung k = x₁ × y₁","3. Ambil nilai baru x₂","4. Hitung y₂ = k ÷ x₂"],b:[
{s:"Sekarang, cara kerjanya. Langkah pertama, tulis dua besaran yang diketahui di soal.",l:0},
{s:"Langkah kedua, kalikan keduanya untuk mendapatkan k.",l:1},
{s:"Langkah ketiga, lihat nilai baru yang ditanyakan.",l:2},
{s:"Langkah keempat, bagi k dengan nilai baru itu. Hasilnya adalah jawabannya.",l:3}]},
{t:"Contoh 1: Pekerja dan Hari",L:["6 pekerja → 20 hari","k = 6 × 20 = 120","Hari = 120 ÷ 8 = 15 hari"],vis:{k:120,xl:"pekerja",yl:"hari",xs:[6,8]},b:[
{s:"Contoh pertama. Enam pekerja menyelesaikan proyek dalam 20 hari. Berapa hari jika dikerjakan 8 pekerja?",l:0,v:0},
{s:"Hitung k. Enam dikali 20 sama dengan 120.",l:1},
{s:"Bagi dengan 8 pekerja. 120 dibagi 8 sama dengan 15. Jadi proyek selesai dalam 15 hari.",l:2,v:1}]},
{t:"Contoh 2: Kecepatan dan Waktu",L:["60 km/jam → 4 jam","k = 60 × 4 = 240","Waktu = 240 ÷ 80 = 3 jam"],vis:{k:240,xl:"km/jam",yl:"jam",xs:[60,80]},b:[
{s:"Contoh kedua. Mobil berkecepatan 60 kilometer per jam tiba dalam 4 jam. Jika kecepatannya 80, berapa jam waktu tempuhnya?",l:0,v:0},
{s:"Jaraknya sama, jadi k sama dengan 60 dikali 4, yaitu 240.",l:1},
{s:"240 dibagi 80 sama dengan 3. Waktu tempuhnya 3 jam.",l:2,v:1}]},
{t:"Contoh 3: Hati-hati Jebakan",L:["40 ekor sapi → 15 hari","Sapi sekarang = 40 + 20 = 60","k = 40 × 15 = 600","Hari = 600 ÷ 60 = 10 hari"],vis:{k:600,xl:"ekor",yl:"hari",xs:[40,60]},b:[
{s:"Contoh ketiga. Pakan 40 ekor sapi cukup untuk 15 hari. Jika ditambah 20 ekor, pakan cukup berapa hari?",l:0,v:0},
{s:"Awas jebakan! Yang dipakai adalah jumlah akhir, yaitu 40 ditambah 20, sama dengan 60 ekor, bukan 20.",l:1},
{s:"Hitung k. 40 dikali 15 sama dengan 600.",l:2},
{s:"600 dibagi 60 sama dengan 10. Pakan cukup untuk 10 hari.",l:3,v:1}]},
{t:"Coba Sendiri",L:["12 pekerja → 10 hari. Jika 8 pekerja, berapa hari?","k = 12 × 10 = 120; 120 ÷ 8 = 15 hari"],vis:{k:120,xl:"pekerja",yl:"hari",xs:[12,8]},b:[
{s:"Sekarang giliranmu. 12 pekerja menyelesaikan bangunan dalam 10 hari. Berapa hari jika hanya 8 pekerja?",l:0,v:0},
{w:7000},
{s:"Jawabannya. k sama dengan 12 dikali 10, yaitu 120. Lalu 120 dibagi 8 sama dengan 15 hari.",l:1,v:1}]},
{t:"Rangkuman",L:["Hasil kali selalu tetap: x × y = k","Pekerja lebih banyak, hari lebih sedikit","Hitung k dulu, lalu bagi dengan nilai baru"],b:[
{s:"Kita rangkum. Pada perbandingan berbalik nilai, hasil kali kedua besaran selalu tetap.",l:0},
{s:"Jika pekerja bertambah, hari berkurang.",l:1},
{s:"Caranya, hitung k terlebih dahulu, lalu bagi dengan nilai yang baru. Terima kasih sudah menonton, sampai jumpa!",l:2}]}
];
var N=S.length,si=0,bi=0,playing=false,tok=0,mute=false,rate=1,tx=2,cx=2,voices=[];
function loadV(){voices=window.speechSynthesis?speechSynthesis.getVoices():[]}
loadV();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=loadV;
function stopSpeech(){tok++;if(window.speechSynthesis)speechSynthesis.cancel()}
function speak(text,done,wait){
 if(!text){setTimeout(done,wait||1000);return}
 var ms=Math.max(2200,text.length*75/rate);
 if(mute||!window.speechSynthesis){setTimeout(done,ms);return}
 var fin=false,f=function(){if(fin)return;fin=true;done()};
 var u=new SpeechSynthesisUtterance(text);u.lang="id-ID";u.rate=rate;
 for(var i=0;i<voices.length;i++){if(voices[i].lang.toLowerCase().indexOf("id")===0){u.voice=voices[i];break}}
 u.onend=f;u.onerror=function(){setTimeout(f,ms)};
 setTimeout(f,ms*2.5+1500);
 speechSynthesis.speak(u);
}
function renderScene(){
 var sc=S[si];$("#ttl").textContent=sc.t;
 $("#ln").innerHTML=sc.L.map(function(x,i){return '<li class="'+(sc.big===i?"big":"")+'">'+x+'</li>'}).join("");
 $("#cv").style.display=sc.vis?"block":"none";
 if(sc.vis){tx=cx=sc.vis.xs[0]}
 [].forEach.call($("#dots").children,function(d,k){d.setAttribute("aria-current",k===si)});
 $("#sub").textContent="";bar();
}
function bar(){$("#pb i").style.width=((si+bi/S[si].b.length)/N*100)+"%"}
function show(b){
 var sc=S[si];
 if(b.l!=null){$("#ln").children[b.l].classList.add("on")}
 if(b.v!=null&&sc.vis)tx=sc.vis.xs[b.v];
 $("#sub").textContent=b.s||"Waktunya berpikir…";bar();
}
function play(){
 if(!playing)return;var b=S[si].b[bi],my=++tok;
 if(window.speechSynthesis)speechSynthesis.cancel();
 show(b);
 speak(b.s,function(){if(my!==tok||!playing)return;step()},b.w);
}
function step(){
 bi++;
 if(bi>=S[si].b.length){si++;bi=0;
  if(si>=N){si=N-1;bi=S[si].b.length-1;playing=false;$("#pp").textContent="Putar ulang";$("#pb i").style.width="100%";return}
  renderScene();
 }
 play();
}
function jump(i){stopSpeech();si=Math.max(0,Math.min(N-1,i));bi=0;renderScene();if(playing)play()}
for(var i=0;i<N;i++){(function(k){var d=document.createElement("button");d.setAttribute("aria-label","Bagian "+(k+1));d.onclick=function(){jump(k)};$("#dots").appendChild(d)})(i)}
$("#pv").onclick=function(){jump(si-1)};
$("#nx").onclick=function(){jump(si+1)};
$("#pp").onclick=function(){
 if(!playing){
  if($("#pp").textContent==="Putar ulang"){si=0;bi=0;renderScene()}
  playing=true;$("#pp").textContent="Jeda";play();
 }else{playing=false;stopSpeech();$("#pp").textContent="Lanjutkan"}
};
$("#mu").onclick=function(){mute=!mute;this.textContent="Suara: "+(mute?"mati":"nyala");if(playing){stopSpeech();play()}};
$("#rt").onchange=function(){rate=parseFloat(this.value);if(playing){stopSpeech();play()}};
$("#go").onclick=function(){$("#start").style.display="none";playing=true;renderScene();play()};
addEventListener("keydown",function(e){if(e.key==="ArrowRight")jump(si+1);if(e.key==="ArrowLeft")jump(si-1);if(e.key===" "&&e.target.tagName!=="BUTTON"){e.preventDefault();$("#pp").click()}});
/* Animasi: persegi panjang x × y dengan luas tetap k */
var cv=$("#cv"),g=cv.getContext("2d");
function fmt(n){return Math.abs(n-Math.round(n))<.05?String(Math.round(n)):n.toFixed(1)}
function draw(){
 requestAnimationFrame(draw);var v=S[si].vis;if(!v)return;
 var dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;if(!w)return;
 if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 cx+=(tx-cx)*.07;var y=v.k/cx,mx=Math.max.apply(null,v.xs),my=v.k/Math.min.apply(null,v.xs);
 var cell=Math.min((w-60)/mx,(h-70)/my),x0=30,yb=h-34,rw=cx*cell,rh=y*cell;
 var gr=g.createLinearGradient(0,yb-rh,0,yb);gr.addColorStop(0,"#fff1c2");gr.addColorStop(1,"#b8862b");
 g.fillStyle=gr;g.globalAlpha=.9;g.fillRect(x0,yb-rh,rw,rh);g.globalAlpha=1;
 if(cell>7){g.strokeStyle="rgba(26,11,58,.55)";g.lineWidth=1;g.beginPath();
  for(var i=1;i<cx;i++){g.moveTo(x0+i*cell,yb-rh);g.lineTo(x0+i*cell,yb)}
  for(var j=1;j<y;j++){g.moveTo(x0,yb-j*cell);g.lineTo(x0+rw,yb-j*cell)}g.stroke()}
 g.fillStyle="#f6f0ff";g.font="700 15px sans-serif";g.textAlign="center";
 g.fillText(fmt(cx)+" "+v.xl,x0+rw/2,yb+22);
 g.textAlign="left";g.fillText(fmt(y)+" "+v.yl,x0+4,Math.max(18,yb-rh-8));
 g.textAlign="right";g.fillStyle="#e8c46a";g.fillText("luas = k = "+v.k,w-12,22);
}
renderScene();draw();
</script>
</body>
</html>
