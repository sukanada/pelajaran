<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contoh Soal</title>
<style>
:root{--gold:#e8c46a;--gold2:#b8862b;--mute:#c4b5e0;--line:rgba(232,196,106,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:22px;color:#f6f0ff;font:16px/1.6 "Trebuchet MS","Segoe UI",Verdana,sans-serif;background:linear-gradient(135deg,#0a0618,#1a0b3a 50%,#2a0f4d);min-height:100vh}
h1{font:700 clamp(1.6rem,4.5vw,2.4rem)/1.2 Georgia,serif;margin:0 0 6px;background:linear-gradient(100deg,#fff1c2,#e8c46a 45%,#b8862b);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:700 1.2rem/1.3 Georgia,serif;margin:0 0 8px;color:var(--gold)}
.card{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.big{font-size:1.1rem}.mute{color:var(--mute);margin:0}
.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;padding:10px 16px;border:0;color:#2a0f4d;background:linear-gradient(135deg,#fff1c2,#e8c46a,#b8862b)}
.steps{display:none;margin-top:10px;padding:12px 16px;background:rgba(0,0,0,.28);border-radius:10px}
.steps.on{display:block}
</style>
</head>
<body>
<h1>Contoh Soal</h1>
<p class="mute">Baca soal, coba hitung sendiri, lalu buka langkahnya.</p>
<div id="ex"></div>
<script>
const EX=[
["Pekerja dan hari","Sebuah proyek diselesaikan 6 pekerja dalam 20 hari. Jika dikerjakan 8 pekerja, berapa hari proyek selesai?","Diketahui 6 pekerja → 20 hari.<br>k = 6 × 20 = 120.<br>Hari = 120 ÷ 8 = <b>15 hari</b>."],
["Kecepatan dan waktu","Mobil berkecepatan 60 km/jam tiba dalam 4 jam. Jika kecepatan 80 km/jam, berapa jam waktu tempuhnya?","Jarak sama, k = 60 × 4 = 240.<br>Waktu = 240 ÷ 80 = <b>3 jam</b>."],
["Persediaan pakan","Pakan 40 ekor sapi cukup 15 hari. Jika ditambah 20 ekor, pakan cukup untuk berapa hari?","Sapi sekarang 40 + 20 = 60 ekor.<br>k = 40 × 15 = 600.<br>Hari = 600 ÷ 60 = <b>10 hari</b>.<br>Awas: pakai jumlah akhir (60), bukan tambahannya."]];
document.getElementById("ex").innerHTML=EX.map((e,i)=>
 `<div class="card"><h2>Soal ${i+1}: ${e[0]}</h2><p class="big">${e[1]}</p><button class="btn" data-i="${i}">Lihat langkah</button><div class="steps" id="s${i}">${e[2]}</div></div>`).join("");
document.querySelectorAll(".btn").forEach(b=>b.onclick=()=>{
 const s=document.getElementById("s"+b.dataset.i);
 s.classList.toggle("on");
 b.textContent=s.classList.contains("on")?"Sembunyikan":"Lihat langkah";
});
</script>
</body>
</html>
